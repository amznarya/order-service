
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orderservice
  namespace: observability-lab
spec:
  replicas: 3
  selector:
    matchLabels:
      app: orderservice
  template:
    metadata:
      labels:
        app: orderservice
    spec:
      containers:
        - name: orderservice
          image: orderservice:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080

          env:
            - name: DB_URL
              value: jdbc:postgresql://postgres:5432/ordersdb
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
            - name: MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT
              value: "http://tempo:4318/v1/traces"

          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "1000m"

          startupProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: orderservice
  namespace: observability-lab
spec:
  type: ClusterIP
  selector:
    app: orderservice
  ports:
    - port: 8080
      targetPort: 8080
